
services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/filiandun/philipp-website:latest
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ConnectionStrings__DatabaseConnection: Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USERNAME};Password=${DB_PASSWORD};
    depends_on:
      - postgres

volumes:
  postgres_local_data:
