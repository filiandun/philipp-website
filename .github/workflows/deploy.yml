name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0'

    - name: Publish Frontend
      run: dotnet publish PhilippWebsite/PhilippWebsite.Client/PhilippWebsite.Client.csproj -c Release -o release

    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    - name: Fix SPA routing (Copy index.html to 404.html)
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Commit & Push to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: release/wwwroot
        branch: gh-pages

    deploy-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0'

    - name: Publish Backend
      run: dotnet publish PhilippWebsite/PhilippWebsite.Server/PhilippWebsite.Server.csproj -c Release -o release-backend

    - name: Copy files to VPS via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "release-backend/*"
        target: "/var/www/philipp-api/"
        strip_components: 1

    - name: Restart systemd service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          systemctl restart philipp-api
