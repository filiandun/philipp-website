<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Philipp's website</title>

    <base href="/" />

    <link rel="icon" type="image/png" href="icon.ico" />

    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/theme.css" />

    <link href="PhilippWebsite.Client.styles.css" rel="stylesheet" />

</head>
    <body>
        <div id="app">
            <div class="load-screen">
                <img class="load-screen-icon" src="icon.ico" alt="Philipp Portfolio">
                <span class="load-screen-text">Loading solution ...</span>

                <div class="load-screen-progress-bar">
                    <div class="blazor-progress-bar"></div>
                </div>
            </div>
        </div>

        <div id="blazor-error-ui">
             An unhandled error has occurred.
            <a href="." class="reload">Reload</a>
            <span class="dismiss">🗙</span>
        </div>

        <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    </body>
</html>
